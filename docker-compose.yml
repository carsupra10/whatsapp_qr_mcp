version: '3.8'

services:
  whatsapp-mcp:
    build: .
    container_name: whatsapp-mcp-server
    restart: unless-stopped
    environment:
      - SESSION_PATH=/data/.wwebjs_auth
      - QUEUE_DB_PATH=/data/queue.json
      - MIN_DELAY=5000
      - MAX_DELAY=15000
      - MAX_RETRIES=3
      - MESSAGES_PER_MINUTE=10
      - NODE_ENV=production
    volumes:
      # Persist session and queue data
      - whatsapp-data:/data
      # Mount logs directory (optional)
      - ./logs:/app/logs
    ports:
      # Expose port if using HTTP API
      - "3000:3000"
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whatsapp-data:
    driver: local
